[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skool-data"
version = "0.1.1"
description = "Capture private Skool community analytics through repeatable HTTP requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
skool-data = "skool_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skool_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
